# ==============================
# TMUX 3.5a - Evangelion Theme
# Blue & Purple Dominant
# ==============================

# --- General ---
set-option -g status on
set-option -g status-interval 2
set-option -g mouse on  # optional: mouse support

# --- Status Bar Styling ---
set-option -g status-bg "#0f0f23"
set-option -g status-fg "#82aaff"
set-option -g status-left-length 100
set-option -g status-right-length 150
set-option -g status-style "bg=#0f0f23,fg=#82aaff,bold"
set-option -g window-status-separator "│"

# --- Active Window ---
set-window-option -g window-status-current-style "bg=#6272a4,fg=#0f0f23,bold"

# --- Inactive Windows ---
set-window-option -g window-status-style "bg=#0f0f23,fg=#82aaff"

# --- Urgent / Bell Windows ---
set-window-option -g window-status-bell-style "bg=#0f0f23,fg=#ff6b9d,bold"

# --- Pane Borders ---
set-option -g pane-border-style "fg=#6272a4"
set-option -g pane-active-border-style "fg=#bb9af7"

# --- Message / Prompts ---
set-option -g message-style "bg=#0f0f23,fg=#82aaff"

# --- Left & Right Status ---
# Window list tetap di kiri, clock / date di kanan
set-option -g status-left " #[fg=#bb9af7,bold]#S#[default] "
set-option -g status-right " #[fg=#82aaff]%Y-%m-%d #[fg=#bb9af7]%H:%M#[default] "

# --- Enable 24-bit true color ---
set-option -ga terminal-overrides ",xterm-256color:Tc"

# --- Reload Shortcut (Prefix + r) ---
bind r source-file ~/.tmux.conf \; display-message "TMUX config reloaded!"
